media:
  - name: images
    label: Photos
    input: src/images
    output: /images
    extensions: [jpg, jpeg, png, webp]

content:
  - name: artworks
    label: Artworks
    path: content/artworks.json
    type: file
    icon: image
    fields:
      - name: items
        label: Paintings
        type: object
        list:
          min: 1
        # shown as the row label in the CMS list, so she can find a painting
        # without opening each one
        fields:
          - name: name
            label: Title
            type: string
            required: true
          - name: image
            label: Photo
            type: image
            required: true
            options:
              media: images
          - name: section
            label: Section
            type: select
            required: true
            default: oil
            options:
              values:
                - { value: oil, label: Oil on Canvas }
                - { value: graphic, label: Graphic Works }
          - name: details
            label: Size, medium, year
            type: string
            description: "e.g. 30x40cm, Oil on Canvas - Painted in 2025 on location."
          - name: series
            label: Series heading (optional)
            type: string
            description: Bold line above the long text. Leave empty for most paintings.
          - name: description
            label: Longer description (optional)
            type: rich-text
          - name: buy_link
            label: Stripe payment link (optional)
            type: string
            description: Paste a Stripe Payment Link to show a "Buy this painting" button. Leave empty to hide it.

  - name: commissions
    label: Commission examples
    path: content/commissions.json
    type: file
    icon: brush
    fields:
      - name: items
        label: Examples
        type: object
        list: true
        fields:
          - name: name
            label: Title
            type: string
            required: true
          - name: image
            label: Photo
            type: image
            required: true
            options:
              media: images
          - name: details
            label: Size, medium, year
            type: string
            description: "e.g. 60x80cm, Oil on Canvas - 2025"
          - name: brief
            label: What the client asked for (optional)
            type: rich-text

  - name: site
    label: About, CV & Contact
    path: content/site.json
    type: file
    icon: user
    fields:
      - name: email
        label: Contact email
        type: string
        required: true
      - name: instagram
        label: Instagram URL
        type: string
      - name: portrait
        label: Portrait photo
        type: image
        options:
          media: images
      - name: about_en
        label: About text (English)
        type: rich-text
      - name: cv_en
        label: CV (English)
        type: rich-text
      - name: about_de
        label: About text (Deutsch)
        type: rich-text
      - name: cv_de
        label: CV (Deutsch)
        type: rich-text

      # everything on the /order/ commission page, so nothing there needs a developer
      - name: commission_intro
        label: "Commissions: intro text"
        type: rich-text
      - name: commission_price_line
        label: "Commissions: price line"
        type: string
        description: One quiet sentence explaining how pricing works. Shown on its own.
      - name: commission_subjects
        label: "Commissions: subjects to choose from"
        type: text
        description: One per line, e.g. Portrait / Pet portrait / Your own idea. The price does not depend on this.
      - name: commission_sizes
        label: "Commissions: sizes and prices"
        type: object
        list: true
        description: The canvas outlines on the page are drawn from these measurements, so keep them accurate.
        fields:
          - name: width_cm
            label: Width (cm)
            type: number
            required: true
          - name: height_cm
            label: Height (cm)
            type: number
            required: true
          - name: price
            label: Full price
            type: string
            required: true
            description: "e.g. €2,000"
          - name: deposit
            label: Amount payable now (half)
            type: string
            required: true
            description: "e.g. €1,000 — must match the amount of the Stripe link below."
          - name: stripe_link
            label: Stripe Payment Link for that half
            type: string
            description: Create a Payment Link in Stripe for exactly the amount above. Leave empty and this size takes no payment — the request just arrives by email.
      # the "Custom size" option prices itself: base + rate x area, rounded to €50
      - name: commission_custom_base
        label: "Commissions: custom size — starting amount (€)"
        type: number
        description: Added to every custom size before the area is counted. Covers materials and setup.
      - name: commission_custom_per_cm2
        label: "Commissions: custom size — € per square centimetre"
        type: number
        description: "Currently 0.28. Check it against the fixed sizes above after changing it: a 60 x 80 canvas is 4,800 cm²."
      - name: commission_custom_stripe_link
        label: "Commissions: custom size — Stripe link"
        type: string
        description: A Stripe Payment Link where the buyer enters the amount themselves (the page tells them the figure). Leave empty and custom sizes are quoted by email instead.
      - name: commission_custom_note
        label: "Commissions: custom size — note"
        type: text

      - name: commission_payment_note
        label: "Commissions: refund promise"
        type: text
        description: Shown under the form. Says what happens if she cannot take the commission on.
      - name: commission_process
        label: "Commissions: how it works"
        type: rich-text
        description: One bold line per step (that becomes the step heading), then the explanation below it.
      - name: commission_response_time
        label: "Commissions: reply promise"
        type: string
        description: Shown under the Send button, e.g. "You will receive a personal reply within two days."
