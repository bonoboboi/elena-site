media:
  - name: images
    label: Фотографии
    input: src/images
    output: /images
    extensions: [jpg, jpeg, png, webp]

content:
  - name: artworks
    label: Картины
    path: content/artworks.json
    type: file
    icon: image
    fields:
      - name: items
        label: Картины
        type: object
        list:
          min: 1
        # shown as the row label in the CMS list, so she can find a painting
        # without opening each one
        fields:
          - name: name
            label: Название
            type: string
            required: true
          - name: image
            label: Фотография
            type: image
            required: true
            options:
              media: images
          - name: section
            label: Раздел
            type: select
            required: true
            default: oil
            options:
              values:
                - { value: oil, label: Масло на холсте }
                - { value: graphic, label: Графика }
          - name: details
            label: Размер, техника, год
            type: string
            description: "Например: 30x40 см, масло на холсте — написано в 2025 году с натуры."
          - name: series
            label: Заголовок серии (необязательно)
            type: string
            description: Жирная строка над длинным текстом. У большинства картин можно оставить пустым.
          - name: description
            label: Подробное описание (необязательно)
            type: rich-text
          - name: buy_link
            label: Ссылка на оплату Stripe (необязательно)
            type: string
            description: Вставьте ссылку Stripe Payment Link, чтобы появилась кнопка «Купить эту картину». Оставьте пустым — кнопки не будет.

  - name: commissions
    label: Примеры работ на заказ
    path: content/commissions.json
    type: file
    icon: brush
    fields:
      - name: items
        label: Примеры
        type: object
        list: true
        fields:
          - name: name
            label: Название
            type: string
            required: true
          - name: image
            label: Фотография
            type: image
            required: true
            options:
              media: images
          - name: subject
            label: Сюжет
            type: select
            required: true
            default: gallery-only
            options:
              values:
                - { value: Portrait, label: Портрет }
                - { value: Pet portrait, label: Портрет питомца }
                - { value: Your own idea, label: Ваша идея }
                - { value: gallery-only, label: Только в ленте (не показывать как пример сюжета) }
            description: На каждое сочетание «сюжет + техника» показывается только один пример — первый в списке. Если сочетание уже занято, выберите «Только в ленте».
          - name: technique
            label: Техника
            type: select
            required: true
            options:
              values:
                - { value: Oil, label: Масло }
                - { value: Oil pastel, label: Масляная пастель }
                - { value: Graphite, label: Графит }
                - { value: Ink, label: Тушь }
                - { value: Mixed technique, label: Смешанная техника }
            description: Когда посетитель выбирает технику на сайте, картинки сюжетов меняются на примеры в этой технике.
          - name: details
            label: Размер, техника, год
            type: string
            description: "Например: 60x80 см, масло на холсте — 2025"
          - name: brief
            label: Что просил заказчик (необязательно)
            type: rich-text

  - name: site
    label: О себе, резюме и контакты
    path: content/site.json
    type: file
    icon: user
    fields:
      - name: email
        label: Контактный e-mail
        type: string
        required: true
      - name: instagram
        label: Ссылка на Instagram
        type: string
      - name: portrait
        label: Ваша фотография
        type: image
        options:
          media: images
      - name: about_en
        label: О себе (по-английски)
        type: rich-text
      - name: cv_en
        label: Резюме (по-английски)
        type: rich-text
      - name: about_de
        label: О себе (по-немецки)
        type: rich-text
      - name: cv_de
        label: Резюме (по-немецки)
        type: rich-text

      # everything on the /order/ commission page, so nothing there needs a developer
      - name: commission_intro
        label: "Заказы: вступительный текст"
        type: rich-text
      - name: commission_price_line
        label: "Заказы: строка о цене"
        type: string
        description: Одно спокойное предложение о том, как считается цена. Стоит на странице отдельно.
      - name: commission_subjects
        label: "Заказы: сюжеты на выбор"
        type: object
        list: true
        description: Каждый показывается картинкой, на которую нажимает посетитель. На цену не влияет. Если переименовать сюжет, скажите разработчику — список в «Примерах работ на заказ» нужно поменять тоже.
        fields:
          - name: label
            label: Название
            type: string
            required: true
            description: "Например: Portrait, Pet portrait, Your own idea"
          - name: image
            label: Картинка-пример
            type: image
            options:
              media: images
            description: Показывается как кнопка. Если пусто — будет пунктирная рамка.
      - name: commission_techniques
        label: "Заказы: техники на выбор"
        type: object
        list: true
        description: Список, из которого выбирает посетитель. Если добавите новую технику, скажите разработчику — её нужно добавить и в выпадающий список у примеров.
        fields:
          - name: label
            label: Название
            type: string
            required: true
      - name: commission_sizes
        label: "Заказы: размеры и цены"
        type: object
        list: true
        description: По этим размерам на странице рисуются прямоугольники холстов, поэтому указывайте их точно.
        fields:
          - name: width_cm
            label: Ширина (см)
            type: number
            required: true
          - name: height_cm
            label: Высота (см)
            type: number
            required: true
          - name: price
            label: Полная цена
            type: string
            required: true
            description: "Например: €2,000"
          - name: deposit
            label: Сумма к оплате сейчас (половина)
            type: string
            required: true
            description: "Например: €1,000 — должна совпадать с суммой в ссылке Stripe ниже."
          - name: stripe_link
            label: Ссылка Stripe на эту половину
            type: string
            description: Создайте в Stripe ссылку ровно на сумму выше. Если оставить пустым, за этот размер деньги не берутся — заявка просто придёт на почту.
      # the "Custom size" option prices itself: base + rate x area, rounded to €50
      - name: commission_custom_base
        label: "Заказы: свой размер — начальная сумма (€)"
        type: number
        description: Прибавляется к любому своему размеру до подсчёта площади. Покрывает материалы и подготовку.
      - name: commission_custom_per_cm2
        label: "Заказы: свой размер — € за квадратный сантиметр"
        type: number
        description: "Сейчас 0,28. После изменения сверьте с ценами выше: холст 60 x 80 — это 4 800 см²."
      - name: commission_custom_stripe_link
        label: "Заказы: свой размер — ссылка Stripe"
        type: string
        description: Ссылка Stripe, где покупатель сам вводит сумму (страница подсказывает ему нужную цифру). Если пусто — цену на свой размер вы называете по почте.
      - name: commission_custom_note
        label: "Заказы: свой размер — пояснение"
        type: text

      - name: commission_payment_note
        label: "Заказы: обещание о возврате"
        type: text
        description: Показывается под формой. Говорит, что будет, если вы не сможете взять заказ.
      - name: commission_response_time
        label: "Заказы: обещание ответить"
        type: string
        description: "Показывается под кнопкой отправки. Например: «Вы получите личный ответ в течение двух дней»."
